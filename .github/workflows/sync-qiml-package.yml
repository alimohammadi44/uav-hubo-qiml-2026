name: Build final QIML editorial package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-qiml-package.yml'
      - 'paper/main.tex'
      - 'paper/references.bib'
      - 'paper/aaai2026.sty'
      - 'paper/aaai2026.bst'
      - 'paper/fig_decoded_paths_all_methods.png'
      - 'results/unified_comparison_with_cpsat.csv'
      - 'tools/regenerate_figure2.py'

permissions:
  contents: write

jobs:
  build-final-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate Figure 2
        run: |
          python3 -m pip install --quiet matplotlib
          python3 tools/regenerate_figure2.py

      - name: Build manuscript PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Validate editorial corrections
        run: |
          cp paper/main.pdf paper/qiml_2026_paper.pdf
          test "$(pdfinfo paper/qiml_2026_paper.pdf | awk '/^Pages:/ {print $2}')" = "6"
          pdfinfo paper/qiml_2026_paper.pdf | grep -F '612 x 792 pts'
          pdftotext paper/qiml_2026_paper.pdf /tmp/qiml.txt
          grep -F 'Copyright' /tmp/qiml.txt | grep -F '2026'
          ! grep -F 'Keywords:' /tmp/qiml.txt
          ! grep -F 'Code Availability' /tmp/qiml.txt
          pdftotext -f 1 -l 1 paper/qiml_2026_paper.pdf /tmp/qiml-p1.txt
          grep -F 'github.com/alimohammadi44/uav-hubo-' /tmp/qiml-p1.txt
          pdftotext -f 6 -l 6 paper/qiml_2026_paper.pdf /tmp/qiml-p6.txt
          ! grep -F 'github.com/alimohammadi44' /tmp/qiml-p6.txt

      - name: Create exact source ZIP
        run: |
          cd paper
          rm -f qiml_2026_paper.zip
          zip -9 -q qiml_2026_paper.zip             main.tex references.bib aaai2026.sty aaai2026.bst             fig_decoded_paths_all_methods.png fig_unified_success_with_cpsat.png
          python3 - <<'PY'
          import zipfile
          expected = {
              "main.tex", "references.bib", "aaai2026.sty", "aaai2026.bst",
              "fig_decoded_paths_all_methods.png",
              "fig_unified_success_with_cpsat.png",
          }
          with zipfile.ZipFile("qiml_2026_paper.zip") as zf:
              names = set(zf.namelist())
          assert names == expected, (names, expected)
          print("Source ZIP contains exactly the required six files.")
          PY

      - name: Create synchronized release ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.').resolve()
          out = root / 'release' / 'uav-hubo-qiml-2026-github-package.zip'
          out.parent.mkdir(exist_ok=True)
          excluded_dirs = {'.git', '.venv', '.venv-m2max', '__pycache__', 'release'}
          excluded_suffixes = {'.aux', '.bbl', '.blg', '.fdb_latexmk', '.fls', '.log', '.out', '.synctex.gz'}
          excluded_names = {'main.pdf', 'abstract.pdf'}
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in excluded_dirs for part in rel.parts):
                      continue
                  if path.name in excluded_names:
                      continue
                  if any(path.name.endswith(s) for s in excluded_suffixes):
                      continue
                  zf.write(path, Path('uav-hubo-qiml-2026') / rel)
          print(out, out.stat().st_size)
          PY

      - name: Commit verified generated artifacts
        run: |
          git config user.name 'qiml-final-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add paper/fig_unified_success_with_cpsat.png                   paper/qiml_2026_paper.pdf paper/qiml_2026_paper.zip                   release/uav-hubo-qiml-2026-github-package.zip
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current.'
          else
            git commit -m '[qiml-final-bot] Build AAAI 2026 editorial-corrected package'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
